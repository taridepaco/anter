<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anter · taridepaco</title>
    <meta
      name="description"
      content="Simulador de colonia de hormigas en la GPU: feromonas, rastros y caminos que se acortan solos."
    />
    <meta property="og:title" content="Anter" />
    <meta
      property="og:description"
      content="Simulador de colonia de hormigas en la GPU: feromonas, rastros y caminos que se acortan solos."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#bfe3d6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // idioma antes del primer pintado: ?lang=, luego la última elección, luego el navegador
      (function () {
        var l = null;
        try {
          var q = new URLSearchParams(location.search).get('lang'),
            s = null;
          try {
            s = localStorage.getItem('taridepaco-lang');
          } catch (e) {
            /* sin almacenamiento */
          }
          var n = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          l = q || s || (/^es/i.test(n) ? 'es' : 'en');
        } catch (e) {
          /* navegador antiguo */
        }
        document.documentElement.lang = l === 'en' ? 'en' : 'es';
      })();
    </script>
    <script src="/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="/css/system.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="util back" href="https://taridepaco.github.io/"><span class="back-arrow" aria-hidden="true">←</span><span class="back-text"> taridepaco</span></a>
      <h1><a href="https://github.com/taridepaco/anter" target="_blank" rel="noopener">Anter</a></h1>
      <span class="tag" data-i18n="kind">Simulador</span>
      <button class="chip theme-btn" type="button">Tema: auto</button>
      <div class="lang-switch" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
    </header>

    <div class="app">
      <details id="panel" open>
        <summary><span class="util" data-i18n="panel">Controles</span></summary>
        <script>
          // móvil y pantallas bajas (el móvil en horizontal): panel plegado antes del primer pintado
          if (window.matchMedia && matchMedia('(max-width: 720px), (max-height: 500px)').matches)
            document.getElementById('panel').open = false;
        </script>
        <!-- lo construye src/ui/panel.ts -->
        <div id="controls"></div>
      </details>

      <!-- solo en el móvil: los tres mandos más usados -->
      <div class="deck" role="group" data-i18n-aria="deck" aria-label="Mandos principales">
        <button class="btn play" type="button" data-act="play" data-i18n-title="t.play">
          <span data-i18n="act.play">Play</span>
        </button>
        <button class="btn ghost" type="button" data-act="step" data-i18n="act.step" data-i18n-title="t.step">Paso</button>
        <button class="btn ghost" type="button" data-act="reset" data-i18n="act.reset" data-i18n-title="t.reset">
          Reiniciar
        </button>
      </div>

      <main class="screen">
        <canvas id="view" data-i18n-aria="aria.sim" aria-label="Mundo de las hormigas"></canvas>
        <div id="stats" class="status" aria-live="off">&nbsp;</div>
        <div id="error" class="error" role="alert" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
